<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" preserveAspectRatio="xMidYMid slice" role="presentation" aria-hidden="true">
  <!--
    Abstract wave field — layered flowing wave contours (topographic line-art).

    Built from the LegalWave design tokens:
      canvas  #1F1B1C   surface #2A2A2D   amber #D2973B / #E8B260

    The contour lines are periodic and carry no focal point, so the artwork can
    sit behind text without competing with it. Rendered as a decorative layer
    (aria-hidden, pointer-events:none); the app remains fully functional if it
    fails to load.
  -->
  <defs>
    <linearGradient id="wf-sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#241E1F"/>
      <stop offset="0.45" stop-color="#1F1B1C"/>
      <stop offset="1" stop-color="#161314"/>
    </linearGradient>

    <radialGradient id="wf-glow" cx="0.72" cy="0.28" r="0.62">
      <stop offset="0" stop-color="#D2973B" stop-opacity="0.17"/>
      <stop offset="0.55" stop-color="#D2973B" stop-opacity="0.055"/>
      <stop offset="1" stop-color="#D2973B" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="wf-glow-cool" cx="0.18" cy="0.78" r="0.55">
      <stop offset="0" stop-color="#6B7C8C" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#6B7C8C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wf-contour" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#D2973B" stop-opacity="0.05"/>
      <stop offset="0.28" stop-color="#D2973B" stop-opacity="0.30"/>
      <stop offset="0.62" stop-color="#E8B260" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D2973B" stop-opacity="0.04"/>
    </linearGradient>

    <linearGradient id="wf-contour-soft" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#8A7F76" stop-opacity="0.04"/>
      <stop offset="0.35" stop-color="#8A7F76" stop-opacity="0.20"/>
      <stop offset="0.75" stop-color="#B8B0A4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#8A7F76" stop-opacity="0.03"/>
    </linearGradient>

    <!-- one repeating wave motif, reused at varying scale/opacity -->
    <path id="wf-line" d="M-200 0 C-100 -34, -20 34, 80 0 C180 -34, 260 34, 360 0 C460 -34, 540 34, 640 0 C740 -34, 820 34, 920 0 C1020 -34, 1100 34, 1200 0 C1300 -34, 1380 34, 1480 0 C1560 -30, 1620 -28, 1680 -6"
          fill="none" stroke-linecap="round"/>
  </defs>

  <!-- base wash -->
  <rect width="1600" height="900" fill="url(#wf-sky)"/>
  <rect width="1600" height="900" fill="url(#wf-glow)"/>
  <rect width="1600" height="900" fill="url(#wf-glow-cool)"/>

  <!-- far field: broad, faint contours -->
  <g stroke="url(#wf-contour-soft)" stroke-width="1.4" opacity="0.85">
    <use href="#wf-line" transform="translate(0 128) scale(1.06 1.15)"/>
    <use href="#wf-line" transform="translate(-40 196) scale(1.12 1.25)"/>
    <use href="#wf-line" transform="translate(20 268) scale(1.02 1.1)"/>
    <use href="#wf-line" transform="translate(-70 344) scale(1.16 1.3)"/>
    <use href="#wf-line" transform="translate(10 424) scale(1.04 1.18)"/>
  </g>

  <!-- mid field: the recognisable wave band -->
  <g stroke="url(#wf-contour)" stroke-width="2">
    <use href="#wf-line" transform="translate(-30 536) scale(1.1 1.35)"/>
    <use href="#wf-line" transform="translate(40 600) scale(1.02 1.5)"/>
    <use href="#wf-line" transform="translate(-90 670) scale(1.18 1.65)"/>
    <use href="#wf-line" transform="translate(20 744) scale(1.06 1.8)"/>
  </g>

  <!-- accent crests: a few brighter strokes catching the light -->
  <g stroke="#E8B260" stroke-linecap="round" fill="none">
    <path d="M-40 574 C60 540, 140 608, 240 574 C340 540, 420 608, 520 574 C620 540, 700 608, 800 574 C900 540, 980 608, 1080 574 C1180 540, 1260 608, 1360 574 C1460 540, 1540 604, 1640 572"
          stroke-width="2.4" opacity="0.30"/>
    <path d="M-40 702 C60 660, 140 744, 240 702 C340 660, 420 744, 520 702 C620 660, 700 744, 800 702 C900 660, 980 744, 1080 702 C1180 660, 1260 744, 1360 702 C1460 660, 1540 740, 1640 700"
          stroke-width="1.9" opacity="0.20"/>
  </g>

  <!-- near field: bold foreground swell -->
  <g stroke="url(#wf-contour)" stroke-width="3" opacity="0.9">
    <use href="#wf-line" transform="translate(-60 812) scale(1.14 2.1)"/>
  </g>

  <!-- subtle vertical shimmer: breaks up the horizontal banding -->
  <g stroke="#F4F1EC" stroke-width="0.6" opacity="0.05" fill="none">
    <path d="M260 0 V900"/>
    <path d="M980 0 V900"/>
  </g>

  <!-- vignette to keep the centre readable -->
  <radialGradient id="wf-vignette" cx="0.5" cy="0.5" r="0.75">
    <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
    <stop offset="1" stop-color="#0C0A0B" stop-opacity="0.55"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#wf-vignette)"/>
</svg>
