<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="LegalWave">
  <title>LegalWave</title>
  <!--
    Wave + scales monogram.

    Designed to stay legible at 24px, so every stroke is >= 2.6 units on the
    64-unit grid and the forms are simplified: a balance beam on a visible
    post, two shallow pans, and a wave cresting beneath.

    Anatomy (top to bottom):
      y 14-19  balance beam + end caps
      y 19-33  pan cords + shallow bowls
      y 33-45  fulcrum post + base
      y 47-58  two wave strokes
  -->
  <defs>
    <!-- no gradients: the marks are all zero-width or shallow paths, where an
         objectBoundingBox gradient has no box to resolve against -->
  </defs>

  <!-- plate -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="#1B1B1D"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="13.25" fill="none" stroke="#3A2E1F" stroke-width="1.5"/>

  <!-- balance beam.
       Solid stroke, not the gradient — a zero-height horizontal path has no
       bounding box, so an objectBoundingBox gradient degenerates to nothing. -->
  <path d="M11 16 H53" stroke="#E8B260" stroke-width="3.2" stroke-linecap="round"/>
  <!-- beam pivot cap -->
  <circle cx="32" cy="16" r="2.6" fill="#E8B260"/>

  <!-- left pan: two cords from the beam down to a shallow bowl -->
  <path d="M11 18.5 L7 29 M11 18.5 L17 29" stroke="#D2973B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M4.5 29 H20.5 C20.5 33.5, 17.5 35.5, 12.5 35.5 C7.5 35.5, 4.5 33.5, 4.5 29 Z"
        fill="#3A2E1F" stroke="#D2973B" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- right pan -->
  <path d="M53 18.5 L47 29 M53 18.5 L57 29" stroke="#D2973B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M43.5 29 H59.5 C59.5 33.5, 56.5 35.5, 51.5 35.5 C46.5 35.5, 43.5 33.5, 43.5 29 Z"
        fill="#3A2E1F" stroke="#D2973B" stroke-width="2.2" stroke-linejoin="round"/>

  <!-- fulcrum post: visible column from the beam pivot down to the base.
       Solid stroke, not the gradient — a zero-width vertical path has no
       bounding box, so an objectBoundingBox gradient degenerates to nothing. -->
  <path d="M32 18.6 V43" stroke="#D2973B" stroke-width="3" stroke-linecap="round"/>
  <!-- fulcrum base -->
  <path d="M24 44 H40" stroke="#D2973B" stroke-width="3" stroke-linecap="round"/>

  <!-- wave cresting beneath the scales.
       Solid strokes, not the gradient — the wave paths are shallow, so a
       bounding-box gradient would band unpredictably across the curve. -->
  <path d="M8 51 C14 46.5, 19 46.5, 25 51 C31 55.5, 37 55.5, 43 51 C48 47.5, 52 47, 56 48.5"
        stroke="#E8B260" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M10 57 C15 53.5, 19 53.5, 24 57 C29 60.5, 34 60.5, 39 57 C43 54.5, 48 54, 54 55.5"
        stroke="#D2973B" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6"/>
</svg>
